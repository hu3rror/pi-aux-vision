# 发布流水线:推送 v* 标签后,经 Trusted Publisher(OIDC)直接把当前版本发布到 npmjs。
# tag push 即发布,全自动,无人工 2FA 闸门。
#
# 前置条件(维护者已在 npmjs.com 配置,勿删):
# - Trusted Publisher 绑定本仓库与 workflow 文件 `publish.yml`(OIDC 认证,无需任何 token)
# - 该配置的 Allowed actions 允许直接发布(npm publish)——只允许 stage 时会 403
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 建占位 Release 需要(gh release create)
  id-token: write # npm --provenance(供应链来源证明)需要 OIDC token

jobs:
  publish:
    name: Publish npm package
    runs-on: windows-latest # 测试依赖 Windows PowerShell + System.Drawing(与开发环境一致)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
        env:
          PI_ESBUILD_DIR: ${{ github.workspace }}/node_modules/esbuild

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Publish to npm registry
        # Trusted Publishing(OIDC)自动认证并生成 provenance,无需 NODE_AUTH_TOKEN
        run: npm publish --provenance

      # 占位 Release:只生成 "Full Changelog: vX...vY" 比较链接,正式分类说明由 agent
      # 发布后按 write-release-notes skill 撰写并用 `gh release edit` 覆盖。
      - name: Create GitHub Release (placeholder notes)
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

